name: Publicar la guia en GitHub Pages

on:
  push:
    branches: [claude/sketchfab-cardiac-lab-y357hr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nota: crear el sitio de Pages no esta permitido al GITHUB_TOKEN
      # (falla con "Resource not accessible by integration" incluso con
      # Pages: write), asi que el sitio se habilita una vez a mano en
      # Settings > Pages eligiendo "GitHub Actions" como origen. A partir
      # de ahi este flujo se encarga de cada despliegue.
      - uses: actions/configure-pages@v5

      # Se publica una lista explicita de archivos: nada mas del repo
      # puede acabar en el sitio por accidente.
      - name: Reunir los archivos del sitio
        run: |
          mkdir -p _sitio
          cp index.html _sitio/
          cp cardiac-lab.html _sitio/
          touch _sitio/.nojekyll
          echo "Archivos que se publican:"
          ls -la _sitio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - id: despliegue
        uses: actions/deploy-pages@v4
